<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4eee2">
  <meta name="description" content="Виштынецкий экомузей — музей природы, истории и культуры Роминтской пущи и мобильный путеводитель по территории.">
  <title>Виштынецкий экомузей</title>
  <link rel="stylesheet" href="app.css?v=7">
  <link rel="stylesheet" href="icons-v3.css?v=4">
  <link rel="stylesheet" href="articles-v3.css?v=2">
  <link rel="stylesheet" href="menu-v3.css?v=2">
  <link rel="stylesheet" href="ai-v3.css?v=2">
  <link rel="stylesheet" href="audio-guide-v1.css?v=3">
  <link rel="stylesheet" href="audio-guide-v2.css?v=7">
</head>
<body>
<!-- Existing museum application markup intentionally unchanged. -->
<div class="museum-app" id="museumApp">
  <main class="screens">
    <section class="screen screen-home is-active" data-screen="home" aria-label="Главная"></section>
    <section class="screen screen-explore" data-screen="explore" aria-label="Исследовать"></section>
    <section class="screen screen-map" data-screen="map" aria-label="Карта"><div id="mapCanvas" class="map-canvas"></div></section>
    <section class="screen screen-articles" data-screen="articles" aria-label="Статьи"><header class="section-header"><div><span class="eyebrow">Цифровой музей</span><h1>Статьи</h1></div><button class="round-menu light" data-open-menu type="button" aria-label="Открыть меню">☰</button></header><label class="search-box"><span>⌕</span><input id="articleSearch" type="search" placeholder="Поиск по музейному архиву"></label><div class="article-chips" id="articleCategories"></div><div class="article-list" id="articleList"></div></section>
    <section class="screen screen-article" data-screen="article" aria-label="Статья"><header class="reader-top"><button id="articleBack" type="button">← Назад</button><div><button id="articleFavorite" type="button" aria-label="В избранное">♡</button><button data-open-menu type="button" aria-label="Открыть меню">☰</button></div></header><article id="articleReader"></article></section>
    <section class="screen screen-audio" data-screen="audio" aria-label="Аудиогид по музею"></section>
    <section class="screen screen-ai" data-screen="ai" aria-label="AI-консультант"></section>
  </main>
  <nav class="bottom-nav" id="bottomNav" aria-label="Основная навигация"><button class="is-active" data-nav="home" type="button"><span>⌂</span>Главная</button><button data-nav="explore" type="button"><span>⌁</span>Исследовать</button><button data-nav="map" type="button"><span>⌖</span>Карта</button><button data-nav="articles" type="button"><span>▤</span>Статьи</button><button data-nav="ai" type="button"><span>✦</span>AI</button></nav>
  <div class="info-sheet" id="infoSheet" aria-hidden="true"><div class="sheet-panel"><button class="sheet-close" id="sheetClose" type="button">×</button><div id="sheetContent"></div></div></div>
</div>
<script src="museum-data.js?v=1"></script><script src="museum-extra-data.js?v=2"></script><script src="icons-v3.js?v=2"></script><script src="icons-v3-runtime.js?v=13"></script><script src="app.js?v=7"></script><script src="education-menu-v1.js?v=1"></script><script src="articles-v3.js?v=2"></script><script src="menu-v3.js?v=2"></script><script src="ai-v3.js?v=2"></script><script src="article-gestures.js?v=3"></script><script src="article-lightbox.js?v=1"></script><script src="audio-guide-data.js?v=57"></script><script src="audio-guide-v2.js?v=57"></script>
</body>
</html>
