<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Стена музея — тест</title><style>body{margin:0;background:#f4eee2;color:#30372f;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 18px 60px}.title{font:clamp(42px,7vw,76px)/.95 Georgia,serif;margin:10px 0 16px}.lead{font-size:18px;line-height:1.55;color:#62685f}.editor{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px}.stage{padding:18px;border-radius:26px;background:#e8dece}.card{position:relative;height:560px;overflow:hidden;background:#fffaf1;border:1px solid #dfd3c2;box-shadow:0 12px 30px #0001}.draw{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.hint{position:absolute;left:20px;top:18px;color:#9a9489;font:16px Georgia;pointer-events:none}.obj{position:absolute;z-index:4;cursor:grab;user-select:none;touch-action:none}.text{padding:8px 12px;background:#fffaf1e8;border-radius:10px;font:24px Georgia;min-width:80px;outline:2px solid transparent}.sticker{font-size:52px}.gif{padding:10px 14px;border-radius:12px;background:#ebe1d0;font-weight:700}.panel{padding:20px;border:1px solid #ddd2c1;border-radius:22px;background:#fffaf1}.panel h2{font:30px Georgia;margin:0 0 15px}.tools,.colors{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}.tools button,.panel button{border:1px solid #d8ccbb;background:#fffaf1;border-radius:11px;padding:10px 12px;cursor:pointer}.colors button{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid white;box-shadow:0 0 0 1px #bbb}.note{font-size:12px;color:#777;line-height:1.45}.textEditor{position:fixed;inset:0;background:#0006;z-index:20;display:none;align-items:center;justify-content:center;padding:20px}.textEditor.open{display:flex}.textBox{width:min(560px,90vw);background:#fffaf1;border-radius:20px;padding:20px;box-shadow:0 20px 60px #0005}.textBox textarea{box-sizing:border-box;width:100%;min-height:130px;border:1px solid #d8ccbb;border-radius:12px;padding:14px;font:22px Georgia;resize:vertical}.textBox .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}@media(max-width:780px){.editor{grid-template-columns:1fr}.card{height:490px}.panel{order:2}}</style></head><body><main class="wrap"><h1 class="title">Стена музея</h1><p class="lead">Нарисуйте, напишите или соберите свой маленький артефакт о Виштынецком крае.</p><div class="editor"><div class="stage"><div class="card" id="card"><canvas class="draw" id="canvas"></canvas><div class="hint">Ваш творческий след</div></div></div><aside class="panel"><h2>Создать</h2><div class="tools"><button id="text">✍ Текст</button><button id="clear">Очистить</button></div><div class="note">Цвет кисти</div><div class="colors"><button data-c="#53684d" style="background:#53684d"></button><button data-c="#6f4d3b" style="background:#6f4d3b"></button><button data-c="#c48b55" style="background:#c48b55"></button><button data-c="#334b62" style="background:#334b62"></button><button data-c="#a34d4d" style="background:#a34d4d"></button></div><div class="note">Размер</div><div class="tools"><button data-s="3">Тонко</button><button data-s="7">Средне</button><button data-s="12">Толсто</button></div><div class="note">Стикеры</div><div class="tools"><button data-st="🌲">🌲</button><button data-st="🦌">🦌</button><button data-st="🦋">🦋</button><button data-st="🌿">🌿</button><button data-st="❤️">❤️</button><button data-st="✨">✨</button></div><div class="note">GIF — тестовые объекты</div><div class="tools"><button data-g="GIF 🌊">🌊</button><button data-g="GIF ✨">✨</button></div></aside></div></main><div class="textEditor" id="textEditor"><div class="textBox"><textarea id="textInput" placeholder="Напишите свой текст..."></textarea><div class="actions"><button id="cancelText">Отмена</button><button id="saveText">Добавить на стену</button></div></div></div><script>const card=document.getElementById('card'),c=document.getElementById('canvas'),x=c.getContext('2d');let color='#53684d',size=4,drawing=false,last=null,dpr=1;function fit(preserve=true){const r=card.getBoundingClientRect();let snapshot=null;if(preserve&&c.width&&c.height){snapshot=document.createElement('canvas');snapshot.width=c.width;snapshot.height=c.height;snapshot.getContext('2d').drawImage(c,0,0)}dpr=Math.max(1,devicePixelRatio||1);c.width=Math.max(1,Math.round(r.width*dpr));c.height=Math.max(1,Math.round(r.height*dpr));c.style.width=r.width+'px';c.style.height=r.height+'px';x.setTransform(dpr,0,0,dpr,0,0);if(snapshot)x.drawImage(snapshot,0,0,snapshot.width,snapshot.height,0,0,r.width,r.height)}function p(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}c.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();drawing=true;c.setPointerCapture(e.pointerId);last=p(e);x.fillStyle=color;x.beginPath();x.arc(last.x,last.y,size/2,0,Math.PI*2);x.fill()},{passive:false});c.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const q=p(e);x.strokeStyle=color;x.lineWidth=size;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(last.x,last.y);x.lineTo(q.x,q.y);x.stroke();last=q},{passive:false});function stop(e){drawing=false;last=null;if(e&&c.hasPointerCapture?.(e.pointerId))c.releasePointerCapture(e.pointerId)}['pointerup','pointercancel'].forEach(t=>c.addEventListener(t,stop));document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>color=b.dataset.c);document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>size=+b.dataset.s);document.getElementById('clear').onclick=()=>{x.clearRect(0,0,c.width/dpr,c.height/dpr);document.querySelectorAll('.obj').forEach(e=>e.remove())};const modal=document.getElementById('textEditor'),input=document.getElementById('textInput');let editing=null;function openText(obj=null){editing=obj;input.value=obj?obj.textContent:'';modal.classList.add('open');setTimeout(()=>input.focus(),80)}document.getElementById('text').onclick=()=>openText();document.getElementById('cancelText').onclick=()=>{modal.classList.remove('open');editing=null};document.getElementById('saveText').onclick=()=>{const v=input.value.trim();if(!v){input.focus();return}if(editing){editing.textContent=v}else add('text',v);modal.classList.remove('open');editing=null};function add(t,v){const e=document.createElement('div');e.className='obj '+t;e.textContent=v;e.style.left='50%';e.style.top='50%';card.appendChild(e);if(t==='text'){e.title='Нажмите дважды или удерживайте для изменения';e.addEventListener('dblclick',()=>openText(e));let timer,moved=false,startX=0,startY=0;e.addEventListener('pointerdown',q=>{if(q.pointerType==='touch'){moved=false;startX=q.clientX;startY=q.clientY;timer=setTimeout(()=>{if(!moved)openText(e)},650)}});e.addEventListener('pointermove',q=>{if(q.pointerType==='touch'&&Math.hypot(q.clientX-startX,q.clientY-startY)>10){moved=true;clearTimeout(timer)}});e.addEventListener('pointerup',()=>clearTimeout(timer));e.addEventListener('pointercancel',()=>clearTimeout(timer))}drag(e);return e}document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>add('sticker',b.dataset.st));document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>add('gif',b.dataset.g));function drag(e){let on=false,dx=0,dy=0;e.addEventListener('pointerdown',q=>{if(e===editing)return;on=true;e.setPointerCapture(q.pointerId);const er=e.getBoundingClientRect();const r=card.getBoundingClientRect();dx=q.clientX-er.left;dy=q.clientY-er.top;q.stopPropagation()});e.addEventListener('pointermove',q=>{if(!on)return;const r=card.getBoundingClientRect();const w=e.offsetWidth,h=e.offsetHeight;let left=q.clientX-r.left-dx,top=q.clientY-r.top-dy;left=Math.max(0,Math.min(left,Math.max(0,r.width-w)));top=Math.max(0,Math.min(top,Math.max(0,r.height-h)));e.style.left=left+'px';e.style.top=top+'px'});['pointerup','pointercancel'].forEach(t=>e.addEventListener(t,()=>on=false))}fit(false);let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>fit(true),150)});</script></body></html>
