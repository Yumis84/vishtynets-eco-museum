<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Стена музея — тест</title><style>body{margin:0;background:#f4eee2;color:#30372f;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 18px 60px}.intro{max-width:720px}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#70766d}.title{font:clamp(42px,7vw,76px)/.95 Georgia,serif;margin:10px 0 16px}.lead{font-size:18px;line-height:1.55;color:#62685f}.editor{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px}.stage{padding:18px;border-radius:26px;background:#e8dece}.card{position:relative;height:560px;overflow:hidden;background:#fffaf1;border:1px solid #dfd3c2;box-shadow:0 12px 30px #0001}.draw{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.hint{position:absolute;left:20px;top:18px;color:#9a9489;font:16px Georgia;pointer-events:none}.obj{position:absolute;z-index:4;cursor:grab;user-select:none;touch-action:none}.text{padding:8px 12px;background:#fffaf1e8;border-radius:10px;font:24px Georgia}.sticker{font-size:52px}.gif{padding:10px 14px;border-radius:12px;background:#ebe1d0;font-weight:700}.panel{padding:20px;border:1px solid #ddd2c1;border-radius:22px;background:#fffaf1}.panel h2{font:30px Georgia;margin:0 0 15px}.tools,.colors{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}.tools button,.panel button{border:1px solid #d8ccbb;background:#fffaf1;border-radius:11px;padding:10px 12px;cursor:pointer}.colors button{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid white;box-shadow:0 0 0 1px #bbb}.note{font-size:12px;color:#777;line-height:1.45}@media(max-width:780px){.editor{grid-template-columns:1fr}.card{height:490px}.panel{order:2}}</style></head><body><main class="wrap"><div class="intro"><span class="eyebrow">Оставьте свой след</span><h1 class="title">Стена музея</h1><p class="lead">Нарисуйте, напишите или соберите свой маленький артефакт о Виштынецком крае.</p></div><div class="editor"><div class="stage"><div class="card" id="card"><canvas class="draw" id="canvas"></canvas><div class="hint">Ваш творческий след</div></div></div><aside class="panel"><h2>Создать</h2><div class="tools"><button id="text">✍ Текст</button><button id="clear">Очистить</button></div><div class="note">Цвет кисти</div><div class="colors"><button data-c="#53684d" style="background:#53684d"></button><button data-c="#6f4d3b" style="background:#6f4d3b"></button><button data-c="#c48b55" style="background:#c48b55"></button><button data-c="#334b62" style="background:#334b62"></button><button data-c="#a34d4d" style="background:#a34d4d"></button></div><div class="note">Размер</div><div class="tools"><button data-s="3">Тонко</button><button data-s="7">Средне</button><button data-s="12">Толсто</button></div><div class="note">Стикеры</div><div class="tools"><button data-st="🌲">🌲</button><button data-st="🦌">🦌</button><button data-st="🦋">🦋</button><button data-st="🌿">🌿</button><button data-st="❤️">❤️</button><button data-st="✨">✨</button></div><div class="note">GIF — тестовые объекты</div><div class="tools"><button data-g="GIF 🌊">🌊</button><button data-g="GIF ✨">✨</button></div></aside></div></main><script>const card=document.getElementById('card'),c=document.getElementById('canvas'),x=c.getContext('2d');let color='#53684d',size=4,drawing=false,last;function fit(){const r=card.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;c.style.width=r.width+'px';c.style.height=r.height+'px';x.setTransform(d,0,0,d,0,0)}function p(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}c.addEventListener('pointerdown',e=>{drawing=true;c.setPointerCapture(e.pointerId);last=p(e)});c.addEventListener('pointermove',e=>{if(!drawing)return;const q=p(e);x.strokeStyle=color;x.lineWidth=size;x.lineCap='round';x.beginPath();x.moveTo(last.x,last.y);x.lineTo(q.x,q.y);x.stroke();last=q});['pointerup','pointercancel','pointerleave'].forEach(t=>c.addEventListener(t,()=>{drawing=false;last=null}));document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>color=b.dataset.c);document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>size=+b.dataset.s);document.getElementById('clear').onclick=()=>x.clearRect(0,0,c.width,c.height);document.getElementById('text').onclick=()=>add('text','Ваше слово ✨');document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>add('sticker',b.dataset.st));document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>add('gif',b.dataset.g));function add(t,v){const e=document.createElement('div');e.className='obj '+t;e.textContent=v;e.style.left='50%';e.style.top='50%';card.appendChild(e);drag(e)}function drag(e){let on=false,dx=0,dy=0;e.addEventListener('pointerdown',q=>{on=true;e.setPointerCapture(q.pointerId);const r=e.getBoundingClientRect();dx=q.clientX-r.left;dy=q.clientY-r.top;q.stopPropagation()});e.addEventListener('pointermove',q=>{if(!on)return;const r=card.getBoundingClientRect();e.style.left=q.clientX-r.left-dx+'px';e.style.top=q.clientY-r.top-dy+'px'});['pointerup','pointercancel'].forEach(t=>e.addEventListener(t,()=>on=false))}fit();addEventListener('resize',fit)</script></body></html>
