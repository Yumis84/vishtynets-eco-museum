<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Стена музея — тест</title><style>body{margin:0;background:#f4eee2;color:#30372f;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 18px 60px}.title{font:clamp(42px,7vw,76px)/.95 Georgia,serif;margin:10px 0 16px}.lead{font-size:18px;line-height:1.55;color:#62685f}.editor{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px}.stage{padding:18px;border-radius:26px;background:#e8dece}.card{position:relative;height:560px;overflow:hidden;background:#fffaf1;border:1px solid #dfd3c2;box-shadow:0 12px 30px #0001}.draw{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.hint{position:absolute;left:20px;top:18px;color:#9a9489;font:16px Georgia;pointer-events:none}.obj{position:absolute;z-index:4;cursor:grab;user-select:none;touch-action:none}.text{padding:6px 8px;background:rgba(255,250,241,var(--text-bg-opacity,.5));border-radius:10px;font:14px Georgia;min-width:70px;max-width:calc(100% - 8px);box-sizing:border-box;white-space:pre-wrap;overflow-wrap:anywhere;opacity:1}.sticker{font-size:52px}.gif{padding:10px 14px;border-radius:12px;background:#ebe1d0;font-weight:700}.text.selected{outline:2px solid #53684d}.panel{padding:20px;border:1px solid #ddd2c1;border-radius:22px;background:#fffaf1}.panel h2{font:30px Georgia;margin:0 0 15px}.tools,.colors{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}.tools button,.panel button{border:1px solid #d8ccbb;background:#fffaf1;border-radius:11px;padding:10px 12px;cursor:pointer}.undoBtn{font-size:21px!important;font-weight:900!important;padding:7px 13px!important;line-height:1}.colors button{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid white;box-shadow:0 0 0 1px #bbb}.opacityControl{margin:2px 0 18px}.opacityControl input{width:100%;accent-color:#555}.opacityLine{display:flex;justify-content:space-between;font-size:12px;color:#777;margin-top:4px}.brushSizes{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 18px;padding:4px 2px}.brushSize{width:36px;height:36px;border:0!important;background:transparent!important;border-radius:50%!important;padding:0!important;display:flex;align-items:center;justify-content:center;cursor:pointer}.brushSize::before{content:"";display:block;width:var(--dot);height:var(--dot);border-radius:50%;background:#30372f}.brushSize.active::after{content:"";position:absolute;width:42px;height:42px;border:2px solid #53684d;border-radius:50%}.note{font-size:12px;color:#777;line-height:1.45}.saveWall{position:static;z-index:10;border:1px solid #53684d!important;background:#53684d!important;color:#fff!important;border-radius:12px!important;padding:11px 18px!important;font-weight:700;box-shadow:0 4px 12px #0002}.saveWall.saved{opacity:.75}.saveInline{margin-left:auto!important}.textEditor{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.42);box-sizing:border-box;overflow:hidden}.textEditor.open{display:block}.textBox{position:fixed;left:50%;top:8px;transform:translateX(-50%);width:min(620px,94vw);height:520px;box-sizing:border-box;background:#fffaf1;border:1px solid #d8ccbb;border-radius:22px;padding:16px;box-shadow:0 20px 60px #0005;display:flex;flex-direction:column;justify-content:flex-start;overflow:auto}.textBox textarea{box-sizing:border-box;width:100%;min-height:150px;flex:1;border:1px solid #d8ccbb;border-radius:12px;padding:14px;font:14px Georgia;background:#fffaf1;resize:vertical}.controls{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:10px;white-space:nowrap;border-top:1px solid #e1d6c6;padding-top:8px}.controlRow{display:flex;align-items:center;justify-content:center;gap:8px;margin:0;white-space:nowrap}.controlLabel{min-width:auto;text-align:left;font-size:15px;font-weight:800;margin-right:6px}.controlRow button{min-width:28px;width:28px;height:28px;border:1px solid #d8ccbb;background:#fffaf1;border-radius:7px;padding:0;font-size:15px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center}.controlValue{min-width:52px;text-align:center;font-weight:900;font-size:16px}.controls .controlRow:first-child{padding-right:18px;border-right:1px solid #d8ccbb}.controls .controlRow:last-child{padding-left:18px}.textBox .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}.textBox .actions button{border:1px solid #d8ccbb;background:#fffaf1;border-radius:11px;padding:10px 12px}@media(max-width:780px){.editor{grid-template-columns:1fr}.card{height:490px}.panel{order:2}.textBox{width:96vw;border-radius:18px;padding:14px}.textBox textarea{min-height:120px}.controls{gap:6px;justify-content:space-between;width:100%;overflow:hidden}.controlRow{gap:4px;flex:1;min-width:0}.controlLabel{font-size:12px;font-weight:800;margin-right:4px}.controlRow button{width:25px;height:25px;min-width:25px;font-size:12px}.controlValue{min-width:42px;font-size:15px}.controls .controlRow:first-child{padding-right:8px}.controls .controlRow:last-child{padding-left:8px}}</style></head><body><main class="wrap"><h1 class="title">Стена музея</h1><p class="lead">Нарисуйте, напишите или соберите свой маленький артефакт о Виштынецком крае.</p><div class="editor"><div class="stage"><div class="card" id="card"><canvas class="draw" id="canvas"></canvas><div class="hint">Ваш творческий след</div></div></div><aside class="panel"><h2>Создать</h2><div class="tools"><button id="text">✍ Текст</button><button id="clear">Очистить</button><button id="undo" class="undoBtn" title="Отменить последнее действие">↶</button></div><div class="note">Цвет кисти</div><div class="colors"><button data-c="#e53935" style="background:#e53935"></button><button data-c="#ff8f00" style="background:#ff8f00"></button><button data-c="#fdd835" style="background:#fdd835"></button><button data-c="#43a047" style="background:#43a047"></button><button data-c="#1e88e5" style="background:#1e88e5"></button><button data-c="#5e35b1" style="background:#5e35b1"></button><button data-c="#8e24aa" style="background:#8e24aa"></button></div><div class="opacityControl"><div class="note">Прозрачность цвета</div><input id="brushOpacity" type="range" min="10" max="100" value="100" step="1"><div class="opacityLine"><span>Прозрачно</span><span id="brushOpacityValue">100%</span><span>Непрозрачно</span></div></div><div class="note">Размер кисти</div><div class="brushSizes"><button class="brushSize active" data-s="2" style="--dot:5px" title="Самая тонкая"></button><button class="brushSize" data-s="5" style="--dot:9px" title="Тонкая"></button><button class="brushSize" data-s="10" style="--dot:15px" title="Средняя"></button><button class="brushSize" data-s="18" style="--dot:23px" title="Толстая"></button><button class="brushSize" data-s="30" style="--dot:32px" title="Большая"></button></div><div class="note">Стикеры</div><div class="tools"><button data-st="🌲">🌲</button><button data-st="🦌">🦌</button><button data-st="🦋">🦋</button><button data-st="🌿">🌿</button><button data-st="❤️">❤️</button><button data-st="✨">✨</button></div><div class="note">GIF — тестовые объекты</div><div class="tools"><button data-g="GIF 🌊">🌊</button><button data-g="GIF ✨">✨</button><button id="saveWall" class="saveWall saveInline">Сохранить</button></div></aside></div></main><div class="textEditor" id="textEditor"><div class="textBox"><textarea id="textInput" placeholder="Напишите свой текст..."></textarea><div class="controls"><div class="controlRow"><div class="controlLabel">Размер</div><button type="button" id="editMinus" aria-label="Уменьшить размер">A−</button><div class="controlValue" id="sizeValue">14 px</div><button type="button" id="editPlus" aria-label="Увеличить размер">A+</button></div><div class="controlRow"><div class="controlLabel">Фон</div><button type="button" id="editOpacityMinus">−</button><div class="controlValue" id="opacityValue">50%</div><button type="button" id="editOpacityPlus">+</button></div></div><div class="actions"><button type="button" id="cancelText">Отмена</button><button type="button" id="saveText">Добавить на стену</button></div></div></div><script>const card=document.getElementById('card'),c=document.getElementById('canvas'),x=c.getContext('2d');let color='#43a047',brushOpacity=1,size=2,drawing=false,last=null,dpr=1,history=[];function snapshot(){history.push(c.toDataURL());if(history.length>30)history.shift()}function restore(data){const im=new Image();im.onload=()=>{x.clearRect(0,0,c.width/dpr,c.height/dpr);x.drawImage(im,0,0,c.width/dpr,c.height/dpr)};im.src=data}function fit(preserve=true){const r=card.getBoundingClientRect();let s=null;if(preserve&&c.width&&c.height){s=document.createElement('canvas');s.width=c.width;s.height=c.height;s.getContext('2d').drawImage(c,0,0)}dpr=Math.max(1,devicePixelRatio||1);c.width=Math.max(1,Math.round(r.width*dpr));c.height=Math.max(1,Math.round(r.height*dpr));c.style.width=r.width+'px';c.style.height=r.height+'px';x.setTransform(dpr,0,0,dpr,0,0);if(s)x.drawImage(s,0,0,s.width,s.height,0,0,r.width,r.height)}function p(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}c.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();snapshot();drawing=true;c.setPointerCapture(e.pointerId);last=p(e);x.fillStyle=color;x.globalAlpha=brushOpacity;x.beginPath();x.arc(last.x,last.y,size/2,0,Math.PI*2);x.fill();x.globalAlpha=1},{passive:false});c.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const q=p(e);x.strokeStyle=color;x.globalAlpha=brushOpacity;x.lineWidth=size;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(last.x,last.y);x.lineTo(q.x,q.y);x.stroke();x.globalAlpha=1;last=q},{passive:false});['pointerup','pointercancel'].forEach(t=>c.addEventListener(t,()=>{drawing=false;last=null}));document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>color=b.dataset.c);document.getElementById('brushOpacity').oninput=e=>{brushOpacity=+e.target.value/100;document.getElementById('brushOpacityValue').textContent=e.target.value+'%'};document.querySelectorAll('.brushSize').forEach(b=>b.onclick=()=>{size=+b.dataset.s;document.querySelectorAll('.brushSize').forEach(q=>q.classList.remove('active'));b.classList.add('active')});document.getElementById('undo').onclick=()=>{if(history.length)restore(history.pop())};document.getElementById('clear').onclick=()=>{snapshot();x.clearRect(0,0,c.width/dpr,c.height/dpr);document.querySelectorAll('.obj').forEach(e=>e.remove());selectedText=null};const modal=document.getElementById('textEditor'),input=document.getElementById('textInput'),sizeValue=document.getElementById('sizeValue'),opacityValue=document.getElementById('opacityValue');let editing=null,selectedText=null,editFontSize=14,editOpacity=50;function fitEditorToKeyboard(){if(!modal.classList.contains('open'))return;const vv=window.visualViewport;const h=vv?Math.round(vv.height):window.innerHeight;const top=vv?Math.round(vv.offsetTop):0;const gap=8;const box=document.querySelector('.textBox');const boxH=Math.max(240,Math.min(520,h-gap*2));modal.style.top='0px';modal.style.height='100%';box.style.top=(top+gap)+'px';box.style.height=boxH+'px';box.style.maxHeight=boxH+'px'}function applyEditorSize(){input.style.setProperty('font-size',editFontSize+'px','important');sizeValue.textContent=editFontSize+' px';if(editing)editing.style.setProperty('font-size',editFontSize+'px','important')}function applyEditorOpacity(){opacityValue.textContent=editOpacity+'%';if(editing)editing.style.setProperty('--text-bg-opacity',editOpacity/100)}function openText(obj=null){editing=obj;editFontSize=obj?parseInt(getComputedStyle(obj).fontSize,10)||14:14;editOpacity=obj?Math.round(parseFloat(getComputedStyle(obj).getPropertyValue('--text-bg-opacity')||.5)*100):50;input.value=obj?obj.textContent:'';applyEditorSize();applyEditorOpacity();modal.classList.add('open');fitEditorToKeyboard();requestAnimationFrame(()=>{fitEditorToKeyboard();input.focus();setTimeout(fitEditorToKeyboard,80)})}document.getElementById('text').onclick=()=>openText();document.getElementById('cancelText').onclick=()=>{modal.classList.remove('open');editing=null};document.getElementById('editMinus').onclick=()=>{editFontSize=Math.max(10,editFontSize-1);applyEditorSize()};document.getElementById('editPlus').onclick=()=>{editFontSize=Math.min(72,editFontSize+1);applyEditorSize()};document.getElementById('editOpacityMinus').onclick=()=>{editOpacity=Math.max(10,editOpacity-10);applyEditorOpacity()};document.getElementById('editOpacityPlus').onclick=()=>{editOpacity=Math.min(100,editOpacity+10);applyEditorOpacity()};document.getElementById('saveText').onclick=()=>{const v=input.value.trim();if(!v){input.focus();return}if(editing){editing.textContent=v;editing.style.setProperty('font-size',editFontSize+'px','important');editing.style.setProperty('--text-bg-opacity',editOpacity/100);editing.style.opacity='1'}else{const e=add('text',v);e.style.setProperty('font-size',editFontSize+'px','important');e.style.setProperty('--text-bg-opacity',editOpacity/100);e.style.opacity='1'}modal.classList.remove('open');editing=null};function add(t,v){const e=document.createElement('div');e.className='obj '+t;e.textContent=v;card.appendChild(e);enableDrag(e);if(t==='text'){e.style.setProperty('--text-bg-opacity',.5);e.style.setProperty('font-size','14px','important');e.style.opacity='1';e.title='Перемещайте одним пальцем. Двойной тап — редактирование. Двумя пальцами — изменить размер окна.';e.addEventListener('pointerup',q=>{if(q.pointerType!=='touch'||e._pinching)return;const now=Date.now();if(e._lastTap&&now-e._lastTap<350)openText(e);e._lastTap=now});e.addEventListener('pointerdown',()=>selectText(e))}return e}document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>add('sticker',b.dataset.st));document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>add('gif',b.dataset.g));function selectText(e){if(selectedText&&selectedText!==e)selectedText.classList.remove('selected');selectedText=e;e.classList.add('selected')}function enableDrag(e){let dragging=false,startX=0,startY=0,baseL=0,baseT=0;let pointers=new Map(),pinching=false,startDist=0,startWidth=70;function distance(){const a=[...pointers.values()];if(a.length<2)return 0;return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}function down(q){if(q.pointerType==='mouse'&&q.button!==0)return;q.preventDefault();q.stopPropagation();pointers.set(q.pointerId,{x:q.clientX,y:q.clientY});if(e.classList.contains('text')&&pointers.size===2){pinching=true;dragging=false;e._pinching=true;startDist=distance();startWidth=e.offsetWidth||70;return}if(pointers.size>1)return;const r=card.getBoundingClientRect(),er=e.getBoundingClientRect();startX=q.clientX;startY=q.clientY;baseL=er.left-r.left;baseT=er.top-r.top;dragging=true;e.setPointerCapture(q.pointerId);if(e.classList.contains('text'))selectText(e)}function move(q){if(!pointers.has(q.pointerId))return;q.preventDefault();pointers.set(q.pointerId,{x:q.clientX,y:q.clientY});if(pinching&&e.classList.contains('text')){const d=distance(),scale=startDist?d/startDist:1,r=card.getBoundingClientRect();const w=Math.max(70,Math.min(r.width-8,startWidth*scale));e.style.width=w+'px';e.style.height='auto';e.style.setProperty('font-size','14px','important')}if(pinching)return;if(!dragging)return;const r=card.getBoundingClientRect(),w=e.offsetWidth,h=e.offsetHeight;let left=baseL+q.clientX-startX,top=baseT+q.clientY-startY;left=Math.max(0,Math.min(left,Math.max(0,r.width-w)));top=Math.max(0,Math.min(top,Math.max(0,r.height-h)));e.style.left=left+'px';e.style.top=top+'px'}function up(q){pointers.delete(q.pointerId);if(pinching&&pointers.size<2){pinching=false;setTimeout(()=>e._pinching=false,120)}dragging=false;if(q&&e.hasPointerCapture?.(q.pointerId))e.releasePointerCapture(q.pointerId)}e.addEventListener('pointerdown',down,{passive:false});e.addEventListener('pointermove',move,{passive:false});e.addEventListener('pointerup',up);e.addEventListener('pointercancel',up)}function saveWall(){const data={canvas:c.toDataURL(),objects:[...card.querySelectorAll('.obj')].map(e=>({className:e.className,text:e.textContent,left:e.style.left,top:e.style.top,width:e.style.width,fontSize:e.style.fontSize,bg:e.style.getPropertyValue('--text-bg-opacity'),opacity:e.style.opacity}))};try{localStorage.setItem('vishtynets-wall',JSON.stringify(data));const b=document.getElementById('saveWall');b.textContent='Сохранено ✓';b.classList.add('saved');setTimeout(()=>{b.textContent='Сохранить';b.classList.remove('saved')},1200)}catch(e){alert('Не удалось сохранить')}}document.getElementById('saveWall').onclick=saveWall;fit(false);addEventListener('resize',()=>fit(true));if(window.visualViewport){visualViewport.addEventListener('resize',fitEditorToKeyboard);visualViewport.addEventListener('scroll',fitEditorToKeyboard)}</script></body></html>
