name: Desktop homepage visual QA
on:
  push:
    branches:
      - feature/desktop-home-main-aligned-20261020
  pull_request:
    paths:
      - 'index.html'
      - 'icons-v3.css'
      - 'desktop-v1.js'
      - 'home-desktop-reference.css'
      - 'home-desktop.css'
      - 'home-museum-style.css'
      - '.github/workflows/desktop-home-visual-qa.yml'
jobs:
  screenshot-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Capture homepage and test basic navigation
        run: |
          python3 -m http.server 8765 >/tmp/museum-server.log 2>&1 &
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const errors=[];
            for (const width of [320,390,768,1024,1280,1440,1920]) {
              const page=await browser.newPage({viewport:{width,height:900},deviceScaleFactor:1});
              page.on('pageerror', e=>errors.push(width+': '+e.message));
              await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(1200);
              await page.screenshot({path:'desktop-home-'+width+'.png',fullPage:true});
              // content-visibility:auto can omit offscreen content in full-page captures.
              await page.locator('#wallChampion').scrollIntoViewIfNeeded();
              await page.waitForTimeout(500);
              if (!await page.locator('#wallChampionTitle').isVisible()) throw Error('Wall section hidden at '+width);
              if (!(await page.locator('#wallChampionContent').innerText()).trim()) throw Error('Wall status empty at '+width);
              await page.screenshot({path:'desktop-wall-'+width+'.png'});
              const title=await page.locator('.screen-home h1').first().textContent();
              if(!title) throw Error('Missing home heading at '+width);
              const desktop=await page.locator('.desktop-v1-nav').first().isVisible();
              if(width>=1024 && !desktop) throw Error('Desktop navigation hidden at '+width);
              if(width<1024 && desktop) throw Error('Desktop navigation visible on mobile at '+width);
              if(width>=1024){
                const menus=page.locator('.desktop-v1-trigger');
                if(await menus.count()!==5)throw Error('Expected five desktop menus at '+width);
                for(let i=0;i<5;i++){
                  await menus.nth(i).click();
                  if(await menus.nth(i).getAttribute('aria-expanded')!=='true')throw Error('Menu failed to open '+i);
                  await page.keyboard.press('Escape');
                  if(await menus.nth(i).getAttribute('aria-expanded')!=='false')throw Error('Menu failed to close '+i);
                }
                if(!await page.locator('.desktop-v1-map button').isVisible())throw Error('Map section missing');
              }else if(await page.locator('.desktop-v1-nav').isVisible())throw Error('Desktop menu visible on mobile');
              await page.close();
            }
            await browser.close();
            if(errors.length) throw Error('JS errors: '+errors.join('; '));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-home-screenshots
          path: |
            desktop-home-*.png
            desktop-wall-*.png
