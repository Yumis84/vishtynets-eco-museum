name: Guest map browser smoke
on:
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - '.github/workflows/guest-map-browser.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run local preview and browser checks
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/museum-preview.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              for(const viewport of [{width:390,height:844},{width:1366,height:900}]){
                const page=await browser.newPage({viewport,deviceScaleFactor:1});
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
                await page.locator('#bottomNav [data-nav="map"]').click();
                await page.locator('[data-map-category="Гостевые дома"]').waitFor({timeout:25000});
                await page.locator('[data-map-category="Гостевые дома"]').click();
                await page.locator('.guest-pin').first().waitFor({timeout:25000});
                const count=await page.locator('.guest-pin').count();
                if(count!==7)throw Error('Expected 7 guest pins, got '+count);
                for(let i=0;i<count;i++){
                  await page.locator('.guest-pin').nth(i).click({force:true});
                  const image=page.locator('#mapCard .map-place-photo img');
                  await image.waitFor({timeout:15000});
                  await image.evaluate(img=>new Promise((resolve,reject)=>{
                    if(img.complete)return img.naturalWidth>0?resolve():reject(Error('Image failed'));
                    img.addEventListener('load',()=>resolve(),{once:true});
                    img.addEventListener('error',()=>reject(Error('Image failed')),{once:true});
                  }));
                  const catalog=page.locator('#openGuestCatalog');
                  await catalog.waitFor();
                  const target=await catalog.evaluate(el=>{
                    const original=window.open;
                    let url=null;
                    window.open=(u)=>{url=u;};
                    try{el.click()}finally{window.open=original}
                    return url;
                  });
                  if(!target || !target.startsWith('https://yumis84.github.io/guest-house-map/?house=house_') || !/^house_[0-9]+$/.test(new URL(target).searchParams.get('house')||''))
                    throw Error('Incorrect house detail link: '+target);
                  console.log('PASS',viewport.width,'house',i+1,'photo and direct link:',target);
                }
                await page.screenshot({path:'/tmp/guest-map-'+viewport.width+'.png'});
                if(errors.length)console.log('Page errors:',errors);
                console.log('PASS',viewport.width,'guest pins:',count,'all 7 photos and links verified');
                await page.close();
              }
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
