name: Temporary audio import PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-audio:
    if: github.head_ref == 'audio-import-temp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio-import-temp
      - name: Download exposition audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/audio/audioguide
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://sdmntprwestus.oaiusercontent.com/files/00000000-6594-8230-b29e-f2d2e8a67978/raw?se=2026-08-18T14%3A35%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=22d836a0-eef4-5d27-9340-0051ed91c961&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-18T08%3A11%3A31Z&ske=2026-08-19T08%3A11%3A31Z&sks=b&skv=2026-02-06&sig=oqaOTb3UalpvOwLtd6qxIUcKOsWdSCLujm9Lxtb2BmA%3D' \
            --output assets/audio/audioguide/exposition-01.m4a
          test "$(stat -c%s assets/audio/audioguide/exposition-01.m4a)" -eq 14136632
      - name: Commit imported audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Yumis'
          git config user.email '52785831+Yumis84@users.noreply.github.com'
          git add assets/audio/audioguide/exposition-01.m4a
          git commit -m 'Import exposition 01 audio asset'
          git push origin HEAD:audio-import-temp
