name: Wall interface browser smoke
on:
  pull_request:
    paths:
      - 'wall.html'
      - 'index.html'
      - 'wall-community.js'
      - '.github/workflows/wall-browser.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check mobile and desktop wall
        run: |
          python3 -m http.server 8765 >/tmp/wall-http.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const width of [390,1366]){
              const page=await browser.newPage({viewport:{width,height:850}});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:8765/wall.html');
              const canvas=page.locator('#canvas');
              if(await canvas.evaluate(el=>el.width===0||el.height===0))throw Error('empty canvas');
              if(await page.locator('[data-c]').count()!==9)throw Error('expected nine colors');
              const rows=await page.locator('[data-c]').evaluateAll(els=>els.map(el=>Math.round(el.getBoundingClientRect().top)));
              if(new Set(rows).size!==1)throw Error('colors wrap into multiple rows');
              if(await page.locator('#eraser').count()!==1)throw Error('eraser missing');
              if(await page.locator('[data-g]').count()!==0)throw Error('demo GIF controls still present');
              if(await page.locator('[data-s]').count()!==5)throw Error('expected five brush sizes');
              if(await page.locator('#brushOpacity').count()!==1)throw Error('opacity control missing');
              await canvas.evaluate(el=>{const ctx=el.getContext('2d');ctx.fillStyle='#ff0000';ctx.fillRect(10,10,10,10)});
              await page.setViewportSize({width:width===390?420:1200,height:850});
              const pixel=await canvas.evaluate(el=>Array.from(el.getContext('2d').getImageData(10,10,1,1).data));
              if(pixel[3]===0)throw Error('resize erased drawing');
              await page.locator('[data-st]').first().click();
              await page.locator('#saveDraft').click();
              if(!await page.evaluate(()=>!!localStorage.getItem('vishtynets-wall-draft-v1')))throw Error('draft not saved');
              await page.reload();
              await page.locator('#loadDraft').click();
              await page.waitForFunction(()=>document.getElementById('draftStatus').textContent.includes('восстановлен'));
              if(await page.locator('.obj.sticker').count()!==1)throw Error('sticker not restored');
              if(errors.length)throw Error(errors.join('; '));
              console.log('PASS wall '+width);
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
